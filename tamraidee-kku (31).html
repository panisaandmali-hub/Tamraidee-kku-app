    <style>

        html, body { background-color: #e5e7eb; font-family: 'Prompt', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }

        .kku-pin.active { transform: scale(1.5); background-color: #CC0000; box-shadow: 0 0 0 6px rgba(204, 0, 0, 0.4); }

<body>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

            { id: 3, title: 'อบรมภาษาจีนพื้นฐานเพื่อการสื่อสารธุรกิจ', desc: 'ปูพื้นฐานภาษาจีนสำหรับการทำงานและธุรกิจ ไม่จำเป็นต้องมีพื้นฐานมาก่อน สอนโดยอาจารย์เจ้าของภาษา', org: 'สถาบันภาษา มหาวิทยาลัยขอนแก่น', date: '22 ส.ค. 2026', time: '13:00 - 16:00', location: 'Online via Zoom Meeting', image: 'https://images.unsplash.com/photo-1546422904-90eab23c3d7e?w=500&q=80', tags: ['ภาษา', 'นักศึกษาเท่านั้น'], status: 'เปิดรับสมัคร', views: 850, reg: 40, max: 100, lat: 16.4452, lng: 102.8265, hours: 3, cost: 0, audience: 'นักศึกษาเท่านั้น' },
            { id: 4, title: 'KKU Job & Career Fair 2026', desc: 'พบกับบริษัทชั้นนำกว่า 100 แห่งที่มารับสมัครงานและนักศึกษาฝึกงาน พร้อมรับฟังการเสวนาทิศทางตลาดแรงงานในอนาคต', org: 'กองกิจการนักศึกษา มข.', date: '21 ส.ค. 2026', time: '09:00 - 16:00', location: 'ศูนย์ประชุมอเนกประสงค์กาญจนาภิเษก', image: 'https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=500&q=80', tags: ['อาชีพ', 'ทุกคน'], status: 'เปิดรับสมัคร', views: 5000, reg: 1200, max: 2000, lat: 16.4526, lng: 102.8248, hours: 6, cost: 250, audience: 'ทุกคน' },
            { id: 5, title: 'ค่ายอาสาปลูกป่าเขื่อนอุบลรัตน์ คืนชีวิตสู่ธรรมชาติ #12', desc: 'ร่วมกันปลูกป่าและสร้างฝายชะลอน้ำเพื่ออนุรักษ์สิ่งแวดล้อม พร้อมเรียนรู้วิถีชีวิตชุมชนรอบเขื่อน', org: 'ชมรมอนุรักษ์สภาพแวดล้อม', date: '5 ก.ย. 2026', time: '06:00 - 18:00', location: 'จุดรวมพล หน้าอาคารคอมเพล็กซ์ มข.', image: 'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?w=500&q=80', tags: ['จิตอาสา', 'เฉพาะสมาชิกชมรม'], status: 'เปิดรับสมัคร', views: 600, reg: 20, max: 50, lat: 16.4580, lng: 102.8270, hours: 12, cost: 0, audience: 'เฉพาะสมาชิกชมรม' },
        ];

        const defaultOrganizerEvents = mockEvents.slice(0, 4).map((event, index) => ({ ...event, id: `seed-${event.id}`, ownerEmail: 'organizer-demo', views: event.views + index * 180, reg: Math.max(12, event.reg), status: index === 1 ? 'ใกล้เต็ม' : 'เปิดรับสมัคร' }));

        const pastActivities = [
            { eventId: 1, year: '2025', title: 'KKU AI Hackathon — รอบที่แล้ว', location: 'ห้องประชุม EN18', image: 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=500&q=80' },
            { eventId: 1, year: '2024', title: 'Innovation Demo Day', location: 'อุทยานวิทยาศาสตร์ มข.', image: 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=500&q=80' },
            { eventId: 2, year: '2025', title: 'Folk Song & Art Market #3', location: 'ริมบึงสีฐาน', image: 'https://images.unsplash.com/photo-1515169067868-5387ec356754?w=500&q=80' },
            { eventId: 2, year: '2024', title: 'KKU Music Night', location: 'ลานกิจกรรมกลางแจ้ง', image: 'https://images.unsplash.com/photo-1524368535928-5b5e00ddc76b?w=500&q=80' },
            { eventId: 3, year: '2025', title: 'Chinese for Business รุ่นก่อน', location: 'สถาบันภาษา มข.', image: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=500&q=80' }
        ];

        // 🎁 ข้อมูลของรางวัลสำหรับระบบ Redeem
        const mockRewards = [
            { id: 1, title: 'คูปองส่วนลดศูนย์อาหาร Complex 20฿', desc: 'ใช้เป็นส่วนลดร้านอาหารที่ร่วมรายการ', cost: 5, icon: 'fa-solid fa-burger', color: 'bg-yellow-500' },
            { id: 2, title: 'กระเป๋าผ้า KKU Activity (Limited)', desc: 'กระเป๋าผ้าแคนวาสสกรีนลายกิจกรรม', cost: 20, icon: 'fa-solid fa-bag-shopping', color: 'bg-blue-500' },
            { id: 3, title: 'แก้วน้ำเก็บความเย็น KKU', desc: 'ลดขยะพลาสติก แถมพกพาสะดวก', cost: 50, icon: 'fa-solid fa-mug-hot', color: 'bg-kku-brick' }
        ];

        const MapViewComponent = ({ selectedMapEvent, setSelectedMapEvent, setViewingEvent, registeredEvents, openGoogleMaps }) => {
            const mapRef = useRef(null);
            const markersRef = useRef({});

            useEffect(() => {
                if (!mapRef.current) {
                    const map = L.map('map-element', { zoomControl: false, attributionControl: false }).setView([16.452, 102.825], 14);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
                    mapRef.current = map;

                    mockEvents.forEach(event => {
                        const icon = L.divIcon({
                            className: 'custom-icon',
                            html: `
                                <div id="pin-${event.id}" class="kku-pin-container">
                                    <div class="kku-pin ${registeredEvents.includes(event.id) ? '!bg-green-500 !border-white !shadow-[0_0_0_4px_rgba(16,185,129,0.2)]' : ''}"></div>
                                    <div class="kku-pin-label">${event.title.substring(0, 12)}...</div>
                                </div>
                            `,
                            iconSize: [100, 40],
                            iconAnchor: [50, 20]
                        });

                        const marker = L.marker([event.lat, event.lng], { icon }).addTo(map);
                        marker.on('click', () => {
                            setSelectedMapEvent(event);
                            map.setView([event.lat - 0.003, event.lng], 15, { animate: true, duration: 0.5 });
                        });
                        markersRef.current[event.id] = marker;
                    });
                }

                Object.values(markersRef.current).forEach(marker => {
                    const el = marker.getElement();
                    if(el && el.querySelector('.kku-pin-container')) {
                        el.querySelector('.kku-pin-container').classList.remove('active');
                    }
                });

                if (selectedMapEvent && markersRef.current[selectedMapEvent.id]) {
                    const activeEl = markersRef.current[selectedMapEvent.id].getElement();
                    if(activeEl) activeEl.querySelector('.kku-pin-container').classList.add('active');
                    mapRef.current.setView([selectedMapEvent.lat - 0.003, selectedMapEvent.lng], 15, { animate: true });
                }
            }, [selectedMapEvent, registeredEvents]);

            return (
                <div style={{ height: 'calc(100vh - 120px)' }} className="w-full relative animate-fade-in bg-gray-100 flex flex-col z-[10]">

                                <button onClick={() => setSelectedMapEvent(null)} className="text-gray-400 text-xl w-6 h-6 flex justify-center items-center"><i className="fa-solid fa-times"></i></button>
                            </div>
                            <div className="flex gap-4 mt-2">
                                <img src={selectedMapEvent.image} onError={handleImageError} className="w-20 h-20 rounded-xl object-cover shrink-0" />
                                <div className="flex-1 flex flex-col justify-between">
                                    <div>
                                        <h4 className="font-bold text-gray-800 text-sm mb-1 leading-tight line-clamp-2">{selectedMapEvent.title}</h4>
                                        <div className="text-[10px] text-gray-500 mb-2"><i className="fa-solid fa-location-dot text-kku-brick w-3"></i> {selectedMapEvent.location.substring(0,25)}...</div>
                                    </div>
                                    <div className="flex gap-2">

                                            {registeredEvents.includes(selectedMapEvent.id) ? <><i className="fa-solid fa-check"></i> สมัครแล้ว</> : 'รายละเอียด'}
                                        </button>
                                        <button onClick={() => openGoogleMaps(selectedMapEvent.lat, selectedMapEvent.lng)} className="w-10 bg-blue-50 text-blue-600 border border-blue-200 rounded-lg flex justify-center items-center shadow-sm active:scale-95 transition-transform" title="เปิด Google Maps">
                                            <i className="fa-solid fa-location-arrow"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

            );

        function App() {

            const [viewingEvent, setViewingEvent] = useState(null);

            const [showAuth, setShowAuth] = useState(false);
            const [authMode, setAuthMode] = useState('login'); 
            const [showAccountMenu, setShowAccountMenu] = useState(false);
            const [authEmail, setAuthEmail] = useState('');
            const [authPass, setAuthPass] = useState('');
            const [authName, setAuthName] = useState('');

            // Data States
            const [likedEvents, setLikedEvents] = useState([]); 
            const [registeredEvents, setRegisteredEvents] = useState([]); 
            const [toastMsg, setToastMsg] = useState('');

            // View-Specific States
            const [searchQuery, setSearchQuery] = useState('');
            const [organizerMode, setOrganizerMode] = useState(false);
            const [organizerModal, setOrganizerModal] = useState(null);
            const [profileAvatar, setProfileAvatar] = useState('empty');
            const [showAvatarModal, setShowAvatarModal] = useState(false);
            const [organizerStatuses, setOrganizerStatuses] = useState({});
            const [userEvents, setUserEvents] = useState([]);
            const [filterType, setFilterType] = useState('ทั้งหมด');
            const [filterFormat, setFilterFormat] = useState('ทุกรูปแบบ');
            const [filterCost, setFilterCost] = useState('ทั้งหมด');
            const [filterAudience, setFilterAudience] = useState('ทุกสถานะ');
            const [profileTab, setProfileTab] = useState('registered');
            const [calendarDate, setCalendarDate] = useState('20 ส.ค. 2026');

            // Gallery States
            const [lightboxIndex, setLightboxIndex] = useState(null);
            const [galleryFilter, setGalleryFilter] = useState(null);
            const [galleryYear, setGalleryYear] = useState('ทั้งหมด');

            const renderAvatarVisual = (sizeClass = 'text-2xl') => profileAvatar === 'empty' ? <div className="w-full h-full bg-gray-100 text-gray-400 rounded-full flex items-center justify-center"><i className={`fa-regular fa-user ${sizeClass}`}></i></div> : profileAvatar.startsWith('data:image/') ? <img src={profileAvatar} alt="รูปโปรไฟล์" className="w-full h-full object-cover rounded-full" /> : <i className={`fa-solid ${profileAvatar} ${sizeClass}`}></i>;

            // 🛡️ ระบบล็อกพื้นหลัง (Body Scroll Lock)
            const isAnyModalOpen = viewingEvent || showAuth || showTicket || registrationForm || showShareMenu || showBuddyModal || showRewardModal || showAvatarModal || organizerModal || lightboxIndex !== null;
            useEffect(() => {
                if (isAnyModalOpen) document.body.style.overflow = 'hidden';
                else document.body.style.overflow = 'auto';
            }, [isAnyModalOpen]);

            // ================= 2. Functions & Handlers ================= //
            const accountEventsKey = (email) => `tamraidee-kku-events-${(email || '').trim().toLowerCase()}`;
            const accountDataKey = (email) => `tamraidee-kku-account-${(email || '').trim().toLowerCase()}`;
            const loadAccountData = (email) => {
                try { return JSON.parse(localStorage.getItem(accountDataKey(email)) || '{"registeredEvents":[],"likedEvents":[],"redeemedHours":0}'); }
                catch (error) { return { registeredEvents: [], likedEvents: [], redeemedHours: 0 }; }
            };
            const saveAccountData = (email, data) => { const current = loadAccountData(email); localStorage.setItem(accountDataKey(email), JSON.stringify({ ...current, ...data })); };
            const loadAccountEvents = (email) => {
                try { return JSON.parse(localStorage.getItem(accountEventsKey(email)) || '[]'); }
                catch (error) { return []; }
            };
            const saveAccountEvents = (email, events) => localStorage.setItem(accountEventsKey(email), JSON.stringify(events));

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 2500);
            };

            const toggleLike = (eventId) => {
                if (!user) { showToast('กรุณาเข้าสู่ระบบก่อนบันทึกกิจกรรม'); setShowAuth(true); return; }
                if (likedEvents.includes(eventId)) {
                    const nextLiked = likedEvents.filter(id => id !== eventId);
                    setLikedEvents(nextLiked);
                    if (user) saveAccountData(user.email, { registeredEvents, likedEvents: nextLiked, redeemedHours });
                    showToast('เลิกบันทึกกิจกรรมแล้ว 💔');
                } else {

            };

            const renderAvatarModal = () => {
                if (!showAvatarModal) return null;
                return (
                    <div className="fixed inset-0 z-[10000] flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm p-0 sm:p-5" onClick={() => setShowAvatarModal(false)}>
                        <div className="bg-white w-full max-w-[420px] rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-slide-up-modal" onClick={e => e.stopPropagation()}>
                            <div className="flex justify-between items-center mb-5"><div><div className="text-[10px] font-bold text-kku-red tracking-wider">PROFILE CUSTOMIZE</div><h3 className="font-bold text-xl text-gray-800">เลือกรูปโปรไฟล์</h3></div><button onClick={() => setShowAvatarModal(false)} className="w-8 h-8 rounded-full bg-gray-100 text-gray-500"><i className="fa-solid fa-times"></i></button></div>
                            <div className="grid grid-cols-4 gap-3">{avatarOptions.map(avatar => <button key={avatar.image} aria-label={avatar.label} title={avatar.label} onClick={() => handleAvatarSelect(avatar.image)} className={`aspect-square rounded-2xl ${avatar.color} flex items-center justify-center border-2 transition-all active:scale-95 overflow-hidden ${profileAvatar === avatar.image ? 'border-kku-brick ring-2 ring-red-100 scale-105' : 'border-transparent'}`}>{avatar.image === 'empty' ? <i className="fa-regular fa-user text-2xl text-gray-400"></i> : <img src={avatar.image} alt="" className="w-full h-full rounded-full object-cover" />}</button>)}</div>
                            <p className="text-[10px] text-gray-400 text-center mt-5">เลือกรูปแบบที่ต้องการ รูปจะถูกบันทึกไว้เฉพาะบัญชีของคุณ</p>
                        </div>
                    </div>
                );
            };

            const renderProfile = () => {
                if (!user) {
                    return (
                        <div className="p-4 pb-24 flex flex-col items-center justify-center min-h-[75vh] text-center animate-fade-in">
                            <div className="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center text-5xl text-gray-300 mb-4 border-4 border-white shadow-sm">
                                <i className="fa-solid fa-user-lock"></i>
                            </div>
                            <h2 className="font-bold text-xl text-gray-800 mb-2">เข้าสู่ระบบเพื่อดูโปรไฟล์</h2>
                            <p className="text-xs text-gray-500 mb-6 max-w-[250px] leading-relaxed">กรุณาเข้าสู่ระบบเพื่อดูกิจกรรมที่คุณได้บันทึก และจัดการตั๋วเข้าร่วมกิจกรรม</p>
                            <button onClick={() => setShowAuth(true)} className="bg-kku-brick hover:bg-kku-red transition-colors text-white font-bold px-8 py-3 rounded-xl shadow-md active:scale-95">
                                เข้าสู่ระบบ / สมัครสมาชิก
                            </button>
                        </div>
                    );
                }

                const displayEvents = profileTab === 'saved' 
                    ? mockEvents.filter(e => likedEvents.includes(e.id))
                    : mockEvents.filter(e => registeredEvents.includes(e.id));

                return (
                    <div className="p-4 pb-24 animate-fade-in bg-gray-50 min-h-screen">
                        <div className="flex items-center gap-4 mb-4 bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <button onClick={() => setShowAvatarModal(true)} className="relative w-16 h-16 bg-red-100 text-kku-brick rounded-full flex items-center justify-center text-2xl font-bold border-2 border-white shadow uppercase active:scale-95 transition-transform overflow-visible" title="เปลี่ยนรูปโปรไฟล์"><div className="w-full h-full rounded-full overflow-hidden">{renderAvatarVisual('text-2xl')}</div><span className="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-[#1E1E2D] text-white text-[10px] flex items-center justify-center border-2 border-white"><i className="fa-solid fa-camera"></i></span></button>
                            <div>
                                <h2 className="font-bold text-lg text-gray-800 leading-tight">{user.name}</h2>
                                <p className="text-[11px] text-gray-500">{user.studentId} • {user.email}</p>
                            </div>
                        </div>

                        {/* 🎁 ปรับปรุงการแสดงผลชั่วโมงกิจกรรม และปุ่มแลกรางวัล */}
                        <div className="bg-[#1E1E2D] p-5 rounded-2xl shadow-md mb-6 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-24 h-24 bg-white opacity-5 rounded-full -translate-y-1/2 translate-x-1/3"></div>
                            <div className="flex justify-between items-end mb-2">
                                <div className="text-white">
                                    <div className="text-[10px] text-gray-400 mb-1">ชั่วโมงกิจกรรมคงเหลือ (เทอม 1/2569)</div>
                                    <div className="text-2xl font-bold">{availableHours} <span className="text-xs font-normal text-gray-400">/ 100 ชม.</span></div>
                                </div>
                                <div className="text-[10px] font-bold bg-orange-500 text-white px-2 py-1 rounded">เป้าหมาย {availableHours >= 100 ? '✅ สำเร็จแล้ว' : `${Math.floor((availableHours/100)*100)}%`}</div>
                            </div>
                            <div className="w-full bg-white/20 rounded-full h-2 mt-3 mb-4">
                                <div className="bg-orange-500 h-2 rounded-full transition-all duration-1000" style={{width: `${Math.min((availableHours/100)*100, 100)}%`}}></div>
                            </div>
                            
                            {/* ส่วนจัดการคะแนน / แลกของรางวัล */}
                            <div className="flex justify-between items-center pt-3 border-t border-gray-700/50">
                                <div className="text-xs text-gray-300">
                                    ชั่วโมงที่ใช้แลกได้: <strong className="text-yellow-400 text-sm ml-1">{availableHours} ชม.</strong>
                                </div>
                                <button onClick={() => setShowRewardModal(true)} className="bg-yellow-500 hover:bg-yellow-400 text-black text-[10px] font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 active:scale-95 transition-all shadow-[0_0_10px_rgba(234,179,8,0.3)]">
                                    <i className="fa-solid fa-gift"></i> แลกของรางวัล
                                </button>
                            </div>
                        </div>

                        <div className="flex bg-white rounded-xl p-1 shadow-sm mb-4 border border-gray-100">
                            <button onClick={() => setProfileTab('registered')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-colors flex justify-center items-center gap-2 ${profileTab === 'registered' ? 'bg-kku-brick text-white shadow' : 'text-gray-500'}`}>
                                <i className="fa-solid fa-ticket"></i> ตั๋วของฉัน ({registeredEvents.length})
                            </button>
                            <button onClick={() => setProfileTab('saved')} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-colors flex justify-center items-center gap-2 ${profileTab === 'saved' ? 'bg-red-50 text-kku-red shadow' : 'text-gray-500'}`}>
                                <i className="fa-solid fa-heart"></i> ที่บันทึกไว้ ({likedEvents.length})
                            </button>
                        </div>

                        <div className="space-y-4">
                            {displayEvents.length > 0 ? (
                                displayEvents.map(event => (
                                    <div key={event.id} className="relative">
                                        {renderEventCard(event)}
                                        {profileTab === 'registered' && (
                                            <div className="absolute bottom-4 right-4 flex gap-2 z-10"><button onClick={(e) => { e.stopPropagation(); setShowTicket(event); }} className="bg-[#1E1E2D] hover:bg-black text-white text-[10px] font-bold px-3 py-2 rounded-lg shadow-lg active:scale-95 transition-transform flex items-center gap-1.5 border border-gray-700"><i className="fa-solid fa-qrcode text-green-400"></i> ดู E-Ticket</button><button onClick={(e) => { e.stopPropagation(); handleCancelRegistration(event.id); }} className="bg-red-50 text-red-600 text-[10px] font-bold px-3 py-2 rounded-lg shadow-sm active:scale-95 transition-transform"><i className="fa-solid fa-xmark"></i></button></div>
                                        )}
                                    </div>
                                ))
                            ) : (
                                <div className="bg-white border border-dashed border-gray-300 rounded-2xl p-10 flex flex-col items-center justify-center text-center mt-6">
                                    <div className="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mb-4">
                                        {profileTab === 'saved' ? <i className="fa-regular fa-heart text-2xl text-gray-400"></i> : <i className="fa-solid fa-ticket text-2xl text-gray-400"></i>}
                                    </div>
                                    <h3 className="font-bold text-gray-800 mb-1">
                                        {profileTab === 'saved' ? 'ยังไม่มีกิจกรรมที่ถูกใจ' : 'ยังไม่ได้ลงทะเบียนกิจกรรมใดๆ'}
                                    </h3>
                                    <p className="text-xs text-gray-500">
                                        {profileTab === 'saved' ? 'กดหัวใจที่กิจกรรมที่คุณสนใจเพื่อเก็บไว้ดูภายหลัง' : 'ลองค้นหากิจกรรมที่น่าสนใจและกดสมัครเข้าร่วมเลย!'}
                                    </p>
                                    <button onClick={() => setActiveTab('home')} className="mt-4 px-4 py-2 bg-gray-100 text-gray-600 text-xs font-bold rounded-lg hover:bg-gray-200 transition-colors">กลับไปหน้าแรก</button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const renderCalendar = () => {
                const calendarDates = [
                    { day: 'พฤ.', date: '20', month: 'ส.ค. 2026' }, 
                    { day: 'ศ.', date: '21', month: 'ส.ค. 2026' }, 
                    { day: 'ส.', date: '22', month: 'ส.ค. 2026' },
                    { day: 'อ.', date: '25', month: 'ส.ค. 2026' }, 
                    { day: 'พฤ.', date: '27', month: 'ส.ค. 2026' },
                    { day: 'ส.', date: '5', month: 'ก.ย. 2026' }
                ];
                const dayEvents = mockEvents.filter(e => e.date.includes(calendarDate.split(' ')[0]));

                return (
                    <div className="p-4 pb-24 animate-slide-up bg-gray-50 min-h-screen">
                        <div className="flex justify-between items-end mb-4">
                            <h2 className="font-bold text-xl text-gray-800">ปฏิทินกิจกรรม</h2>
                            <span className="text-xs font-bold text-gray-500 bg-white border border-gray-200 px-3 py-1 rounded-full shadow-sm">ปีการศึกษา 2026</span>
                        </div>

                        <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-4 mb-2">
                            {calendarDates.map((d, i) => {
                                const fullDateStr = `${d.date} ${d.month}`;
                                const isActive = calendarDate === fullDateStr;
                                const eventCount = mockEvents.filter(e => e.date.includes(d.date)).length;

                                return (
                                    <div key={i} onClick={() => setCalendarDate(fullDateStr)} 
                                        className={`min-w-[65px] flex flex-col items-center justify-center py-3 rounded-2xl border transition-all duration-300 cursor-pointer shadow-sm
                                        ${isActive ? 'bg-kku-brick border-kku-brick text-white scale-105' : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'}`}>
                                        <span className="text-[10px] mb-1">{d.day}</span>
                                        <span className="text-xl font-bold">{d.date}</span>
                                        <span className={`text-[8px] mt-1 font-bold ${isActive ? 'text-red-200' : (eventCount > 0 ? 'text-kku-brick' : 'text-gray-400')}`}>
                                            {eventCount > 0 ? `${eventCount} กิจกรรม` : '-'}
                                        </span>
                                    </div>
                                )
                            })}
                        </div>

                        <div className="mb-4 animate-fade-in" key={calendarDate}>
                            <div className="text-sm font-bold text-gray-700 mb-3 border-l-4 border-kku-brick pl-2">
                                กิจกรรมในวันที่ {calendarDate}
                            </div>
                            
                            {dayEvents.length > 0 ? (
                                <div className="space-y-3">
                                    {dayEvents.map(evt => (
                                        <div key={evt.id} onClick={() => setViewingEvent(evt)} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 flex gap-4 items-start active:scale-[0.98] transition-transform cursor-pointer relative">
                                            {registeredEvents.includes(evt.id) && <i className="absolute top-2 right-2 fa-solid fa-circle-check text-green-500"></i>}
                                            <div className="text-center shrink-0 w-12 pt-1">
                                                <div className="text-[10px] text-gray-500 font-bold mb-1">เวลา</div>
                                                <div className="text-sm font-bold text-kku-red">{evt.time.split(' - ')[0]}</div>
                                            </div>
                                            <div className="h-[50px] w-px bg-gray-200 mx-1"></div>
                                            <div className="flex-1">
                                                <h4 className="font-bold text-gray-800 text-sm mb-1 leading-tight pr-4">{evt.title}</h4>
                                                <div className="text-[11px] text-gray-500 mb-2"><i className="fa-solid fa-location-dot text-kku-brick w-4"></i> {evt.location.split(' ')[0]}</div>
                                                <span className="bg-red-50 text-kku-red text-[10px] font-bold px-2 py-1 rounded-full border border-red-100">{evt.tags[1]}</span>
                                            </div>
                                            <i className="fa-solid fa-chevron-right text-gray-300 mt-3"></i>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="bg-white border border-dashed border-gray-300 rounded-2xl p-10 flex flex-col items-center justify-center text-center">
                                    <div className="w-14 h-14 bg-gray-100 rounded-full flex items-center justify-center mb-3">
                                        <i className="fa-regular fa-calendar-xmark text-xl text-gray-400"></i>
                                    </div>
                                    <h3 className="font-bold text-gray-600 text-sm mb-1">ไม่มีกิจกรรมในวันนี้</h3>
                                    <p className="text-xs text-gray-400">ลองเลือกวันอื่นในปฏิทินด้านบน</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ================= 4. Main Return ================= //
            return (
                <div className="app-container">
                    {renderHeader()}
                    
                    {organizerMode ? renderOrganizerDashboard() : activeTab === 'home' && renderHome()}
                    {!organizerMode && activeTab === 'search' && renderSearch()}
                    {!organizerMode && activeTab === 'calendar' && renderCalendar()}
                    {!organizerMode && activeTab === 'profile' && renderProfile()}
                    {!organizerMode && activeTab === 'map' && (
                        <MapViewComponent 
                            selectedMapEvent={selectedMapEvent} 
                            setSelectedMapEvent={setSelectedMapEvent}
                            setViewingEvent={setViewingEvent}
                            registeredEvents={registeredEvents}
                            openGoogleMaps={openGoogleMaps}
                        />
                    )}

                    {renderEventDetail()}
                    
                    {renderLightbox()}
                    {renderTicketModal()}
                    {renderRegistrationForm()}
                    {renderShareMenu()}
                    {renderRewardModal()} {/* เพิ่ม Modal แลกรางวัล */}
                    {renderAvatarModal()}
                    {renderBuddyModal()}
                    {renderAuthModal()}
                    {renderToast()}
                    {renderBottomNav()}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
